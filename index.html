
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080e20">
<title>NEXORA — Connect Beyond</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#172c58 0%,#0a142c 40%,#060b18 100%);color:#f5f8ff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
.app{width:100%;max-width:430px}
.logo{width:76px;height:76px;border-radius:25px;background:linear-gradient(145deg,#36a4ff,#1750df);display:grid;place-items:center;margin:0 auto 17px;box-shadow:0 0 40px #1676ff55;font-size:35px;font-weight:bold}
h1{text-align:center;font-size:34px;letter-spacing:4px;margin:0}
.tag{text-align:center;color:#91a9d2;margin:9px 0 32px;font-size:13px}
.panel{background:#111d35c9;border:1px solid #ffffff17;border-radius:25px;padding:25px;box-shadow:0 20px 60px #0005;backdrop-filter:blur(18px)}
h2{font-size:22px;margin:0 0 8px}
.desc{color:#91a3c2;font-size:13px;margin:0 0 24px}
label{display:block;font-size:13px;color:#bdcce5;margin:17px 0 8px}
input{width:100%;padding:15px;border:1px solid #304466;background:#091329;color:white;border-radius:12px;outline:none;font-size:15px}
input:focus{border-color:#398eff;box-shadow:0 0 0 3px #2585ff20}
button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:20px;background:linear-gradient(100deg,#238dff,#3159ef);color:white;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
.switch{text-align:center;color:#9aafd0;font-size:13px;margin-top:22px}
.switch span{color:#59aaff;cursor:pointer;font-weight:bold}
#message{text-align:center;font-size:13px;line-height:1.6;margin-top:16px;color:#ffb8b8}
.footer{text-align:center;color:#607697;font-size:11px;margin-top:25px}
.hidden{display:none}
</style>
</head>
<body>
<main class="app">
<div class="logo">N</div>
<h1>NEXORA</h1>
<p class="tag">CONNECT BEYOND LIMITS</p>
<section class="panel">
<div id="auth">
<h2 id="heading">مرحباً بعودتك</h2>
<p class="desc" id="description">سجّل الدخول وتواصل مع العالم.</p>
<form id="authForm">
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="example@email.com" required autocomplete="email">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="••••••••" required minlength="6" autocomplete="current-password">
<div id="nameField" class="hidden">
<label>الاسم الظاهر</label>
<input id="displayName" type="text" placeholder="اسمك داخل NEXORA">
</div>
<button id="submit" type="submit">تسجيل الدخول</button>
</form>
<p class="switch"><span id="toggle">إنشاء حساب جديد</span></p>
<div id="message"></div>
</div>
<div id="logged" class="hidden">
<h2>أهلاً بك في NEXORA</h2>
<p class="desc" id="userEmail"></p>
<p>تم تسجيل الدخول بنجاح.</p>
<button id="logout">تسجيل الخروج</button>
</div>
</section>
<p class="footer">NEXORA © 2026 · PRIVATE & SECURE</p>
</main>
<script>
const SUPABASE_URL="https://bhxqovclabgfxifaxwrf.supabase.co";
const SUPABASE_KEY="sb_publishable_KELy2zTCIz73Os1eQDa8eQ_QWcCFNRJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let signup=false;
const $=id=>document.getElementById(id);
function showMessage(t,ok=false){$("message").textContent=t;$("message").style.color=ok?"#70e5b0":"#ffaaaa"}
function setMode(){
 signup=!signup;
 $("heading").textContent=signup?"إنشاء حساب جديد":"مرحباً بعودتك";
 $("description").textContent=signup?"أنشئ حسابك وابدأ رحلتك مع NEXORA.":"سجّل الدخول وتواصل مع العالم.";
 $("submit").textContent=signup?"إنشاء الحساب":"تسجيل الدخول";
 $("toggle").textContent=signup?"لديك حساب؟ تسجيل الدخول":"إنشاء حساب جديد";
 $("nameField").classList.toggle("hidden",!signup);
 $("password").autocomplete=signup?"new-password":"current-password";
 showMessage("");
}
$("toggle").onclick=setMode;
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("submit");
 button.disabled=true;
 button.textContent="يرجى الانتظار...";
 showMessage("");
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  let result;
  if(signup){
   result=await db.auth.signUp({email,password,options:{data:{display_name:$("displayName").value.trim()}}});
  }else{
   result=await db.auth.signInWithPassword({email,password});
  }
  if(result.error)throw result.error;
  if(signup&&!result.data.session){
   showMessage("تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيده.",true);
  }else if(result.data.session){
   showMessage("تم تسجيل الدخول.",true);
   await renderSession(result.data.session);
  }
 }catch(err){showMessage(err.message||"حدث خطأ، حاول مرة أخرى.")}
 finally{
  button.disabled=false;
  button.textContent=signup?"إنشاء الحساب":"تسجيل الدخول";
 }
});
async function renderSession(session){
 if(session){
  $("auth").classList.add("hidden");
  $("logged").classList.remove("hidden");
  $("userEmail").textContent=session.user.email;
 }else{
  $("auth").classList.remove("hidden");
  $("logged").classList.add("hidden");
 }
}
$("logout").onclick=async()=>{
 const {error}=await db.auth.signOut();
 if(error){showMessage(error.message);return;}
 renderSession(null);
};
db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_IN"||event==="INITIAL_SESSION")renderSession(session);
 if(event==="SIGNED_OUT")renderSession(null);
});
</script>
</body>
</html>
