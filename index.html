<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e20">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080e20;--panel:#0f1a31;--card:#14213b;--line:#ffffff14;--text:#f2f6ff;--muted:#8ea3c4;--accent:#2f7fe8;--accent2:#5b4cf0;--danger:#ff8ea3}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* ---------- تسجيل الدخول ---------- */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1b376b,var(--bg) 65%)}
.authbox{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(140deg,#38a5ff,#2452e9);display:grid;place-items:center;font-size:30px;font-weight:700}
.brand{text-align:center;font-size:28px;letter-spacing:4px}
.tag{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 24px}
h2{font-size:20px}
.muted{color:var(--muted);font-size:13px;margin-top:6px}
label{display:block;color:#b9c9e4;font-size:13px;margin:16px 0 8px}
input,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #304466;background:#091329;outline:none}
input:focus,textarea:focus{border-color:#3898ff}
.primary{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:linear-gradient(100deg,var(--accent),#3159ef);color:#fff;font-weight:700}
.primary:disabled{opacity:.6}
.linkbtn{display:block;margin:18px auto 0;color:#54aaff;font-size:14px}
#message{text-align:center;font-size:13px;line-height:1.7;margin-top:12px;color:var(--danger);overflow-wrap:anywhere}

/* ---------- الشاشة الرئيسية ---------- */
#app{min-height:100vh;max-width:650px;margin:0 auto;padding-bottom:90px;background:var(--bg)}
.top{padding:20px 18px 14px;background:linear-gradient(130deg,#142c54,#0d1931);border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmini{font-size:22px;letter-spacing:3px;font-weight:700}
.brandmini b{color:#48a6ff}
.subtitle{color:var(--muted);font-size:12px;margin-top:4px}
.pill{padding:9px 13px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff1f;font-size:14px}
.search{margin-top:16px}
.search input{background:#081329;border-color:#263b60;border-radius:14px;padding:12px 14px}

.stories{display:flex;gap:14px;overflow-x:auto;padding:16px 18px;border-bottom:1px solid var(--line)}
.story{text-align:center;min-width:60px;font-size:11px;color:#a9bad7}
.circle{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#35b6ff,#7556ff)}
.circle span{width:100%;height:100%;border-radius:50%;background:#142440;display:grid;place-items:center;font-size:18px}

.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.sectionhead h2{font-size:17px}
.btn-soft{padding:9px 13px;border-radius:12px;background:var(--card);border:1px solid #ffffff1f;font-size:14px}
#status{font-size:12px;color:var(--muted);padding:0 18px 10px}

#chatList{padding:0 10px}
.chatrow{display:flex;align-items:center;gap:12px;padding:13px 8px;border-radius:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.chatrow:hover{background:#ffffff08}
.avatar{width:48px;height:48px;flex-shrink:0;border-radius:16px;background:linear-gradient(140deg,#246fba,#343c9c);display:grid;place-items:center;font-size:18px;font-weight:700}
.chatinfo{flex:1;min-width:0}
.chatname{font-weight:700;font-size:14px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.9}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:650px;display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:5}
.navbtn{display:grid;gap:4px;justify-items:center;font-size:11px;color:#8197bb;padding:4px 10px;border-radius:12px}
.navbtn strong{font-size:19px}
.navbtn.active{color:#51aaff}

/* ---------- النوافذ المنبثقة ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:400px;max-height:85vh;overflow:auto;background:var(--card);border:1px solid #ffffff22;border-radius:20px;padding:20px}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.close{font-size:26px;line-height:1;padding:4px 8px;color:var(--muted)}
.userresult{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.danger{width:100%;margin-top:12px;padding:12px;border-radius:12px;background:#3a1d28;border:1px solid #6b2d40;color:var(--danger)}

/* ---------- شاشة المحادثة ---------- */
#conversation{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;max-width:650px;margin:0 auto;height:100dvh}
.convhead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#142746;border-bottom:1px solid #ffffff20}
.convhead .avatar{width:42px;height:42px;font-size:16px;border-radius:14px}
.convbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:16px;background:#1a2d4b;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.mine{align-self:flex-end;background:#176fca}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:4px}
.convform{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
.convform textarea{flex:1;min-width:0;resize:none;border-radius:14px;max-height:120px}
.convform .primary{width:auto;margin:0;padding:12px 16px;border-radius:14px}
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<section id="auth">
 <div class="authbox">
  <div class="logo">N</div>
  <h1 class="brand">NEXORA</h1>
  <p class="tag">CONNECT BEYOND LIMITS</p>
  <h2 id="authTitle">مرحباً بعودتك</h2>
  <p class="muted" id="authDesc">سجّل الدخول وتواصل مع العالم.</p>
  <form id="authForm">
   <label for="email">البريد الإلكتروني</label>
   <input id="email" type="email" required placeholder="example@email.com" autocomplete="email">
   <label for="password">كلمة المرور</label>
   <input id="password" type="password" required minlength="6" placeholder="••••••••" autocomplete="current-password">
   <div id="nameArea" class="hidden">
    <label for="displayName">الاسم الظاهر</label>
    <input id="displayName" placeholder="اسمك" autocomplete="name">
   </div>
   <button class="primary" id="submitBtn" type="submit">تسجيل الدخول</button>
  </form>
  <button class="linkbtn" id="toggle" type="button">إنشاء حساب جديد</button>
  <div id="message" aria-live="polite"></div>
 </div>
</section>

<!-- الشاشة الرئيسية -->
<main id="app" class="hidden">
 <header class="top">
  <div class="topline">
   <div>
    <div class="brandmini">NEX<b>ORA</b></div>
    <div class="subtitle">عالمك، محادثاتك، اتصالك</div>
   </div>
   <button class="pill" id="profileBtn">◉ حسابي</button>
  </div>
  <div class="search">
   <input id="filter" placeholder="ابحث في محادثاتك...">
  </div>
 </header>

 <section class="stories">
  <div class="story"><div class="circle"><span>＋</span></div>حالتي</div>
  <div class="story"><div class="circle"><span>✦</span></div>الحالات</div>
  <div class="story"><div class="circle"><span>◉</span></div>اكتشف</div>
 </section>

 <div class="sectionhead">
  <h2>المحادثات</h2>
  <button class="btn-soft" id="newChat">＋ محادثة جديدة</button>
 </div>
 <div id="status">جارٍ تحميل المحادثات...</div>
 <section id="chatList"></section>

 <nav class="bottom">
  <button class="navbtn active"><strong>▤</strong>المحادثات</button>
  <button class="navbtn" id="storiesBtn"><strong>◉</strong>الحالات</button>
  <button class="navbtn" id="callsBtn"><strong>♧</strong>المكالمات</button>
  <button class="navbtn" id="settingsBtn"><strong>⚙</strong>الإعدادات</button>
 </nav>
</main>

<!-- شاشة المحادثة -->
<section id="conversation" class="hidden">
 <header class="convhead">
  <button class="btn-soft" id="convBack">رجوع</button>
  <div class="avatar" id="convAvatar">N</div>
  <div style="flex:1;min-width:0">
   <div id="convTitle" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">المحادثة</div>
   <div class="muted" id="convState" style="margin-top:2px">تحميل...</div>
  </div>
 </header>
 <div id="messages" class="convbody"></div>
 <form id="sendForm" class="convform">
  <textarea id="messageText" rows="1" maxlength="5000" placeholder="اكتب رسالتك..."></textarea>
  <button class="primary" id="sendBtn" type="submit">إرسال</button>
 </form>
</section>

<!-- الملف الشخصي -->
<div id="profileModal" class="overlay hidden">
 <div class="modal">
  <div class="modalhead">
   <h2>ملفي الشخصي</h2>
   <button class="close" id="profileClose" aria-label="إغلاق">×</button>
  </div>
  <label for="profileDisplay">الاسم الظاهر</label>
  <input id="profileDisplay">
  <label for="profileUsername">اسم المستخدم</label>
  <input id="profileUsername">
  <button class="primary" id="profileSave">حفظ التغييرات</button>
  <button class="danger" id="logoutBtn">تسجيل الخروج</button>
  <div id="profileMessage" class="muted" style="margin-top:12px"></div>
 </div>
</div>

<!-- محادثة جديدة -->
<div id="newPanel" class="overlay hidden">
 <div class="modal">
  <div class="modalhead">
   <h2>محادثة جديدة</h2>
   <button class="close" id="closePanel" aria-label="إغلاق">×</button>
  </div>
  <p class="muted">ابحث عن مستخدم بالاسم أو اسم المستخدم.</p>
  <input id="userSearch" placeholder="اكتب اسم المستخدم..." style="margin-top:12px">
  <div id="userResults" style="margin-top:12px"></div>
 </div>
</div>

<script>
(function(){
"use strict";

const SUPABASE_URL="https://bhxqovclabgfxifaxwrf.supabase.co";
const SUPABASE_KEY="sb_publishable_KELy2zTCIz73Os1eQDa8eQ_QWcCFNRJ";
const $=id=>document.getElementById(id);

let db=null, signup=false, currentUser=null, allChats=[];
let searchTimer=null, activeConversation=null, messageChannel=null;
const knownMessages=new Set();

function showMessage(text,ok=false){
 const el=$("message");
 el.textContent=text;
 el.style.color=ok?"#70e5b0":"#ffaaaa";
}

/* ---------- تسجيل الدخول والتسجيل ---------- */
function setMode(){
 signup=!signup;
 $("authTitle").textContent=signup?"إنشاء حساب جديد":"مرحباً بعودتك";
 $("authDesc").textContent=signup?"أنشئ حسابك في NEXORA.":"سجّل الدخول وتواصل مع العالم.";
 $("submitBtn").textContent=signup?"إنشاء الحساب":"تسجيل الدخول";
 $("toggle").textContent=signup?"لديك حساب؟ تسجيل الدخول":"إنشاء حساب جديد";
 $("nameArea").classList.toggle("hidden",!signup);
 $("password").setAttribute("autocomplete",signup?"new-password":"current-password");
 showMessage("");
}
$("toggle").addEventListener("click",setMode);

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("submitBtn");
 button.disabled=true;
 showMessage("جارٍ الاتصال...",true);

 try{
  if(!db)throw new Error("تعذر الاتصال بخدمة Supabase. تحقق من الإنترنت.");
  const email=$("email").value.trim();
  const password=$("password").value;
  let result;

  if(signup){
   const displayName=$("displayName").value.trim();
   if(!displayName)throw new Error("أدخل الاسم الظاهر أولاً.");
   result=await db.auth.signUp({email,password,options:{data:{display_name:displayName}}});
   if(result.error)throw result.error;
   if(!result.data.session){
    showMessage("تم إنشاء الحساب. أكّد بريدك الإلكتروني ثم سجّل الدخول.",true);
    return;
   }
  }else{
   result=await db.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
  }

  if(result.data.session){
   showMessage("تم تسجيل الدخول بنجاح.",true);
   await enterApp(result.data.session.user);
  }
 }catch(err){
  showMessage(err.message||"حدث خطأ غير معروف.");
 }finally{
  button.disabled=false;
 }
});

async function enterApp(user){
 currentUser=user;
 $("auth").classList.add("hidden");
 $("conversation").classList.add("hidden");
 $("app").classList.remove("hidden");
 await loadChats();
}

/* ---------- قائمة المحادثات ---------- */
async function loadChats(){
 $("status").textContent="جارٍ تحميل المحادثات...";

 const {data,error}=await db.from("conversation_members")
  .select("conversation_id,conversations(id,is_group,title,created_at)")
  .eq("user_id",currentUser.id);

 if(error){
  $("status").textContent="تعذر تحميل المحادثات: "+error.message;
  return;
 }

 const convs=(data||[]).map(r=>r.conversations).filter(Boolean);
 const nameByConv={};

 if(convs.length){
  const {data:others}=await db.from("conversation_members")
   .select("conversation_id,user_id")
   .in("conversation_id",convs.map(c=>c.id))
   .neq("user_id",currentUser.id);

  const otherIds=[...new Set((others||[]).map(m=>m.user_id))];
  const profileById={};
  if(otherIds.length){
   const {data:profiles}=await db.from("profiles")
    .select("id,display_name,username")
    .in("id",otherIds);
   (profiles||[]).forEach(p=>profileById[p.id]=p);
  }
  (others||[]).forEach(m=>{
   if(nameByConv[m.conversation_id])return;
   const p=profileById[m.user_id];
   if(p)nameByConv[m.conversation_id]=p.display_name||p.username;
  });
 }

 allChats=convs.map(c=>({
  ...c,
  title:c.is_group?(c.title||"مجموعة"):(nameByConv[c.id]||"محادثة خاصة")
 }));
 applyFilter();
}

function applyFilter(){
 const q=$("filter").value.trim().toLowerCase();
 renderChats(allChats.filter(c=>c.title.toLowerCase().includes(q)));
}

function renderChats(chats){
 const list=$("chatList");
 list.innerHTML="";
 $("status").textContent=allChats.length?allChats.length+" محادثة":"";

 if(!chats.length){
  list.innerHTML='<div class="empty">ليس لديك محادثات بعد.<br>ابدأ محادثة جديدة مع أحد مستخدمي NEXORA.</div>';
  return;
 }

 chats.forEach(chat=>{
  const row=document.createElement("div");
  row.className="chatrow";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=chat.is_group?"👥":(chat.title.charAt(0)||"N");

  const info=document.createElement("div");
  info.className="chatinfo";

  const name=document.createElement("div");
  name.className="chatname";
  name.textContent=chat.title;

  const preview=document.createElement("div");
  preview.className="preview";
  preview.textContent="افتح المحادثة";

  info.append(name,preview);
  row.append(avatar,info);
  row.addEventListener("click",()=>openConversation(chat.id,chat.title));
  list.append(row);
 });
}

$("filter").addEventListener("input",applyFilter);

/* ---------- محادثة جديدة ---------- */
$("newChat").addEventListener("click",()=>{
 $("newPanel").classList.remove("hidden");
 $("userSearch").value="";
 $("userResults").textContent="";
});
$("closePanel").addEventListener("click",()=>$("newPanel").classList.add("hidden"));

$("userSearch").addEventListener("input",()=>{
 clearTimeout(searchTimer);
 searchTimer=setTimeout(searchUsers,400);
});

async function searchUsers(){
 const query=$("userSearch").value.trim();
 const results=$("userResults");
 if(query.length<2){
  results.textContent="اكتب حرفين على الأقل للبحث.";
  return;
 }
 results.textContent="جارٍ البحث...";

 const safe=query.replace(/[*,()"]/g,"");
 const {data,error}=await db.from("profiles")
  .select("id,username,display_name")
  .neq("id",currentUser.id)
  .or(`username.ilike.*${safe}*,display_name.ilike.*${safe}*`)
  .limit(15);

 if(error){
  results.textContent="تعذر البحث: "+error.message;
  return;
 }
 results.innerHTML="";
 if(!data||!data.length){
  results.textContent="لم يتم العثور على مستخدمين.";
  return;
 }

 data.forEach(user=>{
  const row=document.createElement("div");
  row.className="userresult";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.style.width="42px";
  avatar.style.height="42px";
  avatar.textContent=(user.display_name||user.username||"N").charAt(0);

  const info=document.createElement("div");
  info.style.minWidth="0";
  const name=document.createElement("div");
  name.className="chatname";
  name.textContent=user.display_name||"مستخدم NEXORA";
  const handle=document.createElement("div");
  handle.className="preview";
  handle.textContent=user.username?"@"+user.username:"";

  info.append(name,handle);
  row.append(avatar,info);
  row.addEventListener("click",()=>startChat(user));
  results.append(row);
 });
}

async function startChat(user){
 $("userResults").textContent="جارٍ إنشاء المحادثة...";
 const {data:convId,error}=await db.rpc("create_direct_conversation",{p_other_user_id:user.id});
 if(error){
  $("userResults").textContent="تعذر إنشاء المحادثة: "+error.message;
  return;
 }
 $("newPanel").classList.add("hidden");
 await loadChats();
 openConversation(convId,user.display_name||user.username||"مستخدم NEXORA");
}

/* ---------- الملف الشخصي ---------- */
$("profileBtn").addEventListener("click",async()=>{
 const {data,error}=await db.from("profiles")
  .select("id,username,display_name").eq("id",currentUser.id).single();
 if(error){alert(error.message);return;}
 $("profileDisplay").value=data.display_name||"";
 $("profileUsername").value=data.username||"";
 $("profileMessage").textContent="";
 $("profileModal").classList.remove("hidden");
});
$("profileClose").addEventListener("click",()=>$("profileModal").classList.add("hidden"));

$("profileSave").addEventListener("click",async()=>{
 const display_name=$("profileDisplay").value.trim();
 const username=$("profileUsername").value.trim();
 if(!display_name||!username){
  $("profileMessage").textContent="أدخل الاسم واسم المستخدم.";
  return;
 }
 const {error}=await db.from("profiles").update({display_name,username}).eq("id",currentUser.id);
 $("profileMessage").textContent=error?error.message:"تم حفظ الملف الشخصي.";
});

$("logoutBtn").addEventListener("click",async()=>{
 if(!confirm("هل تريد تسجيل الخروج؟"))return;
 const {error}=await db.auth.signOut();
 if(error){alert(error.message);return;}
 location.reload();
});

$("storiesBtn").addEventListener("click",()=>alert("قسم الحالات قيد التطوير."));
$("callsBtn").addEventListener("click",()=>alert("المكالمات تحتاج إعداد خدمة اتصال مستقلة."));
$("settingsBtn").addEventListener("click",()=>alert("إعدادات الحساب قيد التطوير."));

/* ---------- الرسائل ---------- */
function renderMessage(m){
 if(knownMessages.has(m.id))return;
 knownMessages.add(m.id);

 const box=$("messages");
 const placeholder=box.querySelector(".empty");
 if(placeholder)box.innerHTML="";

 const el=document.createElement("div");
 el.className="msg"+(m.sender_id===currentUser.id?" mine":"");
 el.textContent=m.content||"";

 const stamp=document.createElement("small");
 stamp.textContent=new Date(m.created_at).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
 el.appendChild(stamp);

 box.appendChild(el);
 box.scrollTop=box.scrollHeight;
}

function showEmpty(text){
 const box=$("messages");
 box.innerHTML="";
 const div=document.createElement("div");
 div.className="empty";
 div.textContent=text;
 box.appendChild(div);
}

async function openConversation(id,title){
 activeConversation=id;
 knownMessages.clear();
 $("convTitle").textContent=title;
 $("convAvatar").textContent=title.charAt(0)||"N";
 showEmpty("جارٍ تحميل الرسائل...");
 $("app").classList.add("hidden");
 $("conversation").classList.remove("hidden");

 const {data,error}=await db.from("messages")
  .select("id,sender_id,content,created_at")
  .eq("conversation_id",id)
  .is("deleted_at",null)
  .order("created_at",{ascending:true})
  .limit(300);

 if(error){
  showEmpty("تعذر تحميل الرسائل: "+error.message);
  return;
 }

 $("messages").innerHTML="";
 (data||[]).forEach(renderMessage);
 if(!data||!data.length)showEmpty("لا توجد رسائل بعد. اكتب أول رسالة.");

 if(messageChannel){
  await db.removeChannel(messageChannel);
  messageChannel=null;
 }
 messageChannel=db.channel("nexora-"+id)
  .on("postgres_changes",
   {event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+id},
   payload=>renderMessage(payload.new))
  .subscribe(status=>{
   $("convState").textContent=status==="SUBSCRIBED"?"متصل — استقبال فوري":"الاتصال: "+status;
  });
}

$("convBack").addEventListener("click",async()=>{
 if(messageChannel){
  await db.removeChannel(messageChannel);
  messageChannel=null;
 }
 activeConversation=null;
 $("conversation").classList.add("hidden");
 $("app").classList.remove("hidden");
});

$("sendForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const input=$("messageText");
 const content=input.value.trim();
 if(!content||!activeConversation)return;

 const btn=$("sendBtn");
 btn.disabled=true;
 const {data,error}=await db.from("messages")
  .insert({conversation_id:activeConversation,sender_id:currentUser.id,content,message_type:"text"})
  .select("id,sender_id,content,created_at")
  .single();
 btn.disabled=false;

 if(error){
  alert("تعذر الإرسال: "+error.message);
  return;
 }
 input.value="";
 renderMessage(data);
});

$("messageText").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  $("sendForm").requestSubmit();
 }
});

/* ---------- التهيئة ---------- */
async function initialize(){
 if(!window.supabase){
  showMessage("تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت.");
  return;
 }
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

 db.auth.onAuthStateChange(event=>{
  if(event==="SIGNED_OUT"){
   currentUser=null;
   $("app").classList.add("hidden");
   $("conversation").classList.add("hidden");
   $("auth").classList.remove("hidden");
  }
 });

 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(data.session)await enterApp(data.session.user);
 }catch(err){
  showMessage("خطأ في تهيئة التطبيق: "+err.message);
 }
}

initialize();
})();
</script>
</body>
</html>
