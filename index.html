<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e20">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e20;color:#f5f7ff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1b376b,#080e20 65%)}
.authbox{width:100%;max-width:420px;background:#111d35;border:1px solid #ffffff20;border-radius:25px;padding:28px}
.logo{width:65px;height:65px;border-radius:21px;background:linear-gradient(140deg,#38a5ff,#2452e9);display:grid;place-items:center;font-size:32px;font-weight:bold;margin:0 auto 15px}
.brand{text-align:center;font-size:30px;letter-spacing:4px;margin:0}
.tag{text-align:center;color:#91a9d2;font-size:12px;margin:8px 0 28px}
h2{font-size:21px}
label{display:block;color:#b9c9e4;font-size:13px;margin:16px 0 8px}
input{width:100%;padding:14px;border-radius:11px;border:1px solid #304466;background:#091329;color:white;outline:none}
input:focus{border-color:#3898ff}
.primary{border:0;border-radius:12px;padding:14px;background:linear-gradient(100deg,#238dff,#3159ef);color:white;font-weight:bold;width:100%;margin-top:20px}
.primary:disabled{opacity:.6}
.switch{text-align:center;color:#91a9d2;font-size:13px;margin-top:20px}
.switch span{color:#54aaff;cursor:pointer}
#message{font-size:13px;text-align:center;line-height:1.7;color:#ffaaaa;margin-top:12px;overflow-wrap:anywhere}
#app{min-height:100vh;max-width:650px;margin:auto;background:#0b1428;position:relative;padding-bottom:85px}
.top{padding:22px 19px 17px;background:linear-gradient(130deg,#142c54,#0d1931);border-bottom:1px solid #ffffff12}
.topline{display:flex;align-items:center;justify-content:space-between}
.brandmini{font-size:24px;letter-spacing:3px;font-weight:bold}
.brandmini b{color:#48a6ff}
.profilebtn,.newbtn{border:1px solid #ffffff20;background:#ffffff0c;color:#fff;border-radius:12px;padding:10px 13px}
.subtitle{color:#8da6ce;font-size:12px;margin-top:7px}
.search{margin-top:18px}
.search input{background:#081329;border-color:#263b60;border-radius:13px}
.stories{display:flex;gap:16px;overflow-x:auto;padding:17px 18px;border-bottom:1px solid #ffffff12}
.story{text-align:center;min-width:61px;font-size:11px;color:#a9bad7}
.circle{width:53px;height:53px;border-radius:50%;padding:3px;margin:0 auto 7px;background:linear-gradient(135deg,#35b6ff,#7556ff)}
.circle span{height:100%;width:100%;display:grid;place-items:center;border-radius:50%;background:#142440;font-size:19px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:20px 19px 10px}
.sectionhead h2{font-size:17px;margin:0}
.muted{color:#8298bc;font-size:12px}
#chatList{padding:0 13px}
.chatrow{display:flex;align-items:center;gap:13px;padding:14px 8px;border-bottom:1px solid #ffffff0d;cursor:pointer}
.avatar{width:49px;height:49px;flex-shrink:0;border-radius:17px;background:linear-gradient(140deg,#246fba,#343c9c);display:grid;place-items:center;font-size:19px;font-weight:bold}
.chatinfo{flex:1;min-width:0}
.chatname{font-weight:bold;font-size:14px;margin-bottom:7px}
.preview{font-size:12px;color:#8499ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:#8da2c4;padding:45px 20px;font-size:13px;line-height:2}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:650px;margin:auto;background:#101d35;border-top:1px solid #ffffff17;display:flex;justify-content:space-around;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:5}
.navbtn{background:none;border:0;color:#8197bb;font-size:11px;display:grid;gap:5px;justify-items:center}
.navbtn strong{font-size:20px}
.navbtn.active{color:#51aaff}
#newPanel{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:18px}
.modal{width:100%;max-width:420px;background:#14213b;border:1px solid #ffffff22;border-radius:20px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.close{background:none;border:0;color:white;font-size:24px}
.userresult{display:flex;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid #ffffff12;cursor:pointer}
#status{font-size:12px;color:#8fa7ca;padding:12px 19px}
</style>
</head>
<body>

<section id="auth">
 <div class="authbox">
  <div class="logo">N</div>
  <h1 class="brand">NEXORA</h1>
  <p class="tag">CONNECT BEYOND LIMITS</p>
  <div id="authArea">
   <h2 id="authTitle">مرحباً بعودتك</h2>
   <p class="muted" id="authDesc">سجّل الدخول وتواصل مع العالم.</p>
   <form id="authForm">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" required placeholder="example@email.com" autocomplete="email">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" required minlength="6" placeholder="••••••••" autocomplete="current-password">
    <div id="nameArea" class="hidden">
     <label for="displayName">الاسم الظاهر</label>
     <input id="displayName" placeholder="اسمك" autocomplete="name">
    </div>
    <button class="primary" id="submitBtn" type="submit">تسجيل الدخول</button>
   </form>
   <p class="switch"><span id="toggle" role="button" tabindex="0">إنشاء حساب جديد</span></p>
   <div id="message" aria-live="polite"></div>
  </div>
 </div>
</section>

<main id="app" class="hidden">
 <header class="top">
  <div class="topline">
   <div>
    <div class="brandmini">NEX<b>ORA</b></div>
    <div class="subtitle">عالمك، محادثاتك، اتصالك</div>
   </div>
   <button class="profilebtn" id="profileBtn">◉ حسابي</button>
  </div>
  <div class="search">
   <input id="filter" placeholder="ابحث في محادثاتك...">
  </div>
 </header>

 <section class="stories">
  <div class="story"><div class="circle"><span>＋</span></div>حالتي</div>
  <div class="story"><div class="circle"><span>✦</span></div>الحالات</div>
  <div class="story"><div class="circle"><span>◉</span></div>اكتشف</div>
 </section>

 <div class="sectionhead">
  <h2>المحادثات</h2>
  <button class="newbtn" id="newChat">＋ محادثة جديدة</button>
 </div>
 <div id="status">جارٍ تحميل المحادثات...</div>
 <section id="chatList"></section>

 <nav class="bottom">
  <button class="navbtn active"><strong>▤</strong>المحادثات</button>
  <button class="navbtn" id="storiesBtn"><strong>◉</strong>الحالات</button>
  <button class="navbtn" id="callsBtn"><strong>♧</strong>المكالمات</button>
  <button class="navbtn" id="settingsBtn"><strong>⚙</strong>الإعدادات</button>
 </nav>
</main>

<div id="newPanel" class="hidden">
 <div class="modal">
  <div class="modalhead">
   <h2>محادثة جديدة</h2>
   <button class="close" id="closePanel">×</button>
  </div>
  <p class="muted">ابحث عن مستخدم بالاسم أو اسم المستخدم.</p>
  <input id="userSearch" placeholder="اكتب اسم المستخدم...">
  <div id="userResults"></div>
 </div>
</div>

<script>
(function(){
"use strict";

const SUPABASE_URL="https://bhxqovclabgfxifaxwrf.supabase.co";
const SUPABASE_KEY="sb_publishable_KELy2zTCIz73Os1eQDa8eQ_QWcCFNRJ";
const $=id=>document.getElementById(id);

let db=null;
let signup=false;
let currentUser=null;
let allChats=[];
let searchTimer=null;

function showMessage(message,success=false){
 $("message").textContent=message;
 $("message").style.color=success?"#70e5b0":"#ffaaaa";
}

function setMode(){
 signup=!signup;
 $("authTitle").textContent=signup?"إنشاء حساب جديد":"مرحباً بعودتك";
 $("authDesc").textContent=signup?"أنشئ حسابك في NEXORA.":"سجّل الدخول وتواصل مع العالم.";
 $("submitBtn").textContent=signup?"إنشاء الحساب":"تسجيل الدخول";
 $("toggle").textContent=signup?"لديك حساب؟ تسجيل الدخول":"إنشاء حساب جديد";
 $("nameArea").classList.toggle("hidden",!signup);
 $("password").autocomplete=signup?"new-password":"current-password";
 showMessage("");
}

$("toggle").addEventListener("click",setMode);
$("toggle").addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){e.preventDefault();setMode();}
});

async function enterApp(user){
 currentUser=user;
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
 await loadChats();
}

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("submitBtn");
 button.disabled=true;
 button.textContent="يرجى الانتظار...";
 showMessage("جارٍ الاتصال...");

 try{
  if(!db)throw new Error("تعذر الاتصال بخدمة Supabase. تحقق من الإنترنت.");

  const email=$("email").value.trim();
  const password=$("password").value;
  let result;

  if(signup){
   const displayName=$("displayName").value.trim();
   if(!displayName)throw new Error("أدخل الاسم الظاهر أولاً.");

   result=await db.auth.signUp({
    email:email,
    password:password,
    options:{data:{display_name:displayName}}
   });

   if(result.error)throw result.error;

   if(!result.data.session){
    showMessage("تم إنشاء الحساب. افتح بريدك الإلكتروني وأكّد الحساب، ثم سجّل الدخول.",true);
    return;
   }
  }else{
   result=await db.auth.signInWithPassword({
    email:email,
    password:password
   });
   if(result.error)throw result.error;
  }

  if(result.data.session){
   showMessage("تم تسجيل الدخول بنجاح.",true);
   await enterApp(result.data.session.user);
  }else{
   showMessage("لم يتم إنشاء جلسة دخول. تحقق من بريدك الإلكتروني.");
  }

 }catch(err){
  showMessage(err.message||"حدث خطأ غير معروف.");
 }finally{
  button.disabled=false;
  button.textContent=signup?"إنشاء الحساب":"تسجيل الدخول";
 }
});

async function loadChats(){
 $("status").textContent="جارٍ تحميل المحادثات...";
 const {data,error}=await db.from("conversation_members")
  .select("conversation_id,conversations(id,is_group,title,created_at)")
  .eq("user_id",currentUser.id);

 if(error){
  $("status").textContent="تعذر تحميل المحادثات: "+error.message;
  return;
 }

 allChats=(data||[]).map(item=>item.conversations).filter(Boolean);
 renderChats(allChats);
}

function renderChats(chats){
 $("chatList").innerHTML="";
 $("status").textContent=chats.length?chats.length+" محادثة":"لا توجد محادثات حتى الآن";

 if(!chats.length){
  $("chatList").innerHTML='<div class="empty">ليس لديك محادثات بعد.<br>ابدأ محادثة جديدة مع أحد مستخدمي NEXORA.</div>';
  return;
 }

 chats.forEach(chat=>{
  const row=document.createElement("div");
  row.className="chatrow";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=chat.is_group?"👥":"N";

  const info=document.createElement("div");
  info.className="chatinfo";

  const name=document.createElement("div");
  name.className="chatname";
  name.textContent=chat.title||"محادثة خاصة";

  const preview=document.createElement("div");
  preview.className="preview";
  preview.textContent="افتح المحادثة";

  info.append(name,preview);
  row.append(avatar,info);

  row.addEventListener("click",()=>{
   alert("واجهة الرسائل سنضيفها في المرحلة التالية.");
  });

  $("chatList").append(row);
 });
}

$("filter").addEventListener("input",()=>{
 const q=$("filter").value.trim().toLowerCase();
 renderChats(allChats.filter(chat=>
  (chat.title||"محادثة خاصة").toLowerCase().includes(q)
 ));
});

$("newChat").addEventListener("click",()=>{
 $("newPanel").classList.remove("hidden");
 $("userSearch").value="";
 $("userResults").textContent="";
});

$("closePanel").addEventListener("click",()=>{
 $("newPanel").classList.add("hidden");
});

$("userSearch").addEventListener("input",()=>{
 clearTimeout(searchTimer);
 searchTimer=setTimeout(searchUsers,400);
});

async function searchUsers(){
 const query=$("userSearch").value.trim();
 if(query.length<2){
  $("userResults").textContent="اكتب حرفين على الأقل للبحث.";
  return;
 }

 $("userResults").textContent="جارٍ البحث...";

 const safeQuery=query.replace(/[%_]/g,"");
 const {data,error}=await db.from("profiles")
  .select("id,username,display_name")
  .neq("id",currentUser.id)
  .or("username.ilike.%"+safeQuery+"%,display_name.ilike.%"+safeQuery+"%")
  .limit(15);

 if(error){
  $("userResults").textContent="تعذر البحث: "+error.message;
  return;
 }

 $("userResults").innerHTML="";

 if(!data||!data.length){
  $("userResults").textContent="لم يتم العثور على مستخدمين.";
  return;
 }

 data.forEach(user=>{
  const row=document.createElement("div");
  row.className="userresult";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=(user.display_name||user.username||"N").slice(0,1);

  const info=document.createElement("div");
  const name=document.createElement("div");
  name.className="chatname";
  name.textContent=user.display_name||"مستخدم NEXORA";

  const handle=document.createElement("div");
  handle.className="preview";
  handle.textContent=user.username?"@"+user.username:"";

  info.append(name,handle);
  row.append(avatar,info);
  row.addEventListener("click",()=>startChat(user));
  $("userResults").append(row);
 });
}

async function startChat(user){
 $("userResults").textContent="جارٍ إنشاء المحادثة...";

 const {data,error}=await db.rpc("create_direct_conversation",{
  p_other_user_id:user.id
 });

 if(error){
  $("userResults").textContent="تعذر إنشاء المحادثة: "+error.message;
  return;
 }

 $("newPanel").classList.add("hidden");
 await loadChats();
 alert("تم إنشاء المحادثة أو فتح محادثتك السابقة.");
}

$("profileBtn").addEventListener("click",async()=>{
 if(!confirm("هل تريد تسجيل الخروج؟"))return;
 const {error}=await db.auth.signOut();
 if(error){alert(error.message);return;}
});

$("storiesBtn").addEventListener("click",()=>{
 alert("قسم الحالات قيد التطوير.");
});
$("callsBtn").addEventListener("click",()=>{
 alert("المكالمات تحتاج إعداد خدمة اتصال مستقلة.");
});
$("settingsBtn").addEventListener("click",()=>{
 alert("إعدادات الحساب قيد التطوير.");
});

async function initialize(){
 try{
  if(!window.supabase){
   showMessage("تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت.");
   return;
  }

  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const {data,error}=await db.auth.getSession();
  if(error)throw error;

  if(data.session){
   await enterApp(data.session.user);
  }
 }catch(error){
  showMessage("خطأ في تهيئة التطبيق: "+error.message);
 }
}

dbReady();
function dbReady(){initialize();}

db && db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  currentUser=null;
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
 }
});

})();
</script>
</body>
</html>
