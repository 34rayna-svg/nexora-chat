<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e20">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e20;color:#f5f7ff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1b376b,#080e20 65%)}
.authbox{width:100%;max-width:420px;background:#111d35;border:1px solid #ffffff20;border-radius:25px;padding:28px}
.logo{width:65px;height:65px;border-radius:21px;background:linear-gradient(140deg,#38a5ff,#2452e9);display:grid;place-items:center;font-size:32px;font-weight:bold;margin:0 auto 15px}
.brand{text-align:center;font-size:30px;letter-spacing:4px;margin:0}
.tag{text-align:center;color:#91a9d2;font-size:12px;margin:8px 0 28px}
h2{font-size:21px;margin:0}
label{display:block;color:#b9c9e4;font-size:13px;margin:16px 0 8px}
input,textarea{width:100%;padding:14px;border-radius:11px;border:1px solid #304466;background:#091329;color:white;outline:none}
input:focus,textarea:focus{border-color:#3898ff}
.primary{border:0;border-radius:12px;padding:14px;background:linear-gradient(100deg,#238dff,#3159ef);color:white;font-weight:bold;width:100%;margin-top:20px}
.primary:disabled{opacity:.6}
.switch{text-align:center;color:#91a9d2;font-size:13px;margin-top:20px}
.switch span{color:#54aaff;cursor:pointer}
#message{font-size:13px;text-align:center;line-height:1.7;color:#ffaaaa;margin-top:12px;overflow-wrap:anywhere}
#app{min-height:100vh;max-width:650px;margin:auto;background:#0b1428;position:relative;padding-bottom:85px}
.top{padding:22px 19px 17px;background:linear-gradient(130deg,#142c54,#0d1931);border-bottom:1px solid #ffffff12}
.topline{display:flex;align-items:center;justify-content:space-between}
.brandmini{font-size:24px;letter-spacing:3px;font-weight:bold}
.brandmini b{color:#48a6ff}
.profilebtn,.newbtn{border:1px solid #ffffff20;background:#ffffff0c;color:#fff;border-radius:12px;padding:10px 13px}
.subtitle{color:#8da6ce;font-size:12px;margin-top:7px}
.search{margin-top:18px}
.search input{background:#081329;border-color:#263b60;border-radius:13px}
.stories{display:flex;gap:16px;overflow-x:auto;padding:17px 18px;border-bottom:1px solid #ffffff12}
.story{text-align:center;min-width:61px;font-size:11px;color:#a9bad7}
.circle{width:53px;height:53px;border-radius:50%;padding:3px;margin:0 auto 7px;background:linear-gradient(135deg,#35b6ff,#7556ff)}
.circle span{height:100%;width:100%;display:grid;place-items:center;border-radius:50%;background:#142440;font-size:19px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:20px 19px 10px}
.sectionhead h2{font-size:17px}
.muted{color:#8298bc;font-size:12px}
#chatList{padding:0 13px}
.chatrow{display:flex;align-items:center;gap:13px;padding:14px 8px;border-bottom:1px solid #ffffff0d;cursor:pointer}
.avatar{width:49px;height:49px;flex-shrink:0;border-radius:17px;background:linear-gradient(140deg,#246fba,#343c9c);display:grid;place-items:center;font-size:19px;font-weight:bold}
.chatinfo{flex:1;min-width:0}
.chatname{font-weight:bold;font-size:14px;margin-bottom:7px}
.preview{font-size:12px;color:#8499ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:#8da2c4;padding:45px 20px;font-size:13px;line-height:2}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:650px;margin:auto;background:#101d35;border-top:1px solid #ffffff17;display:flex;justify-content:space-around;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:5}
.navbtn{background:none;border:0;color:#8197bb;font-size:11px;display:grid;gap:5px;justify-items:center}
.navbtn strong{font-size:20px}
.navbtn.active{color:#51aaff}
#newPanel{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:18px}
.modal{width:100%;max-width:420px;background:#14213b;border:1px solid #ffffff22;border-radius:20px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.close{background:none;border:0;color:white;font-size:24px}
.userresult{display:flex;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid #ffffff12;cursor:pointer}
#status{font-size:12px;color:#8fa7ca;padding:12px 19px}
#conversation{position:fixed;inset:0;z-index:20;background:#080e20;display:flex;flex-direction:column;max-width:650px;margin:auto;width:100%;height:100dvh}
.convhead{display:flex;align-items:center;gap:12px;padding:14px;background:#142746;border-bottom:1px solid #ffffff20}
.convbody{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;background:#1a2d4b;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#176fca}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:5px}
.convform{display:flex;gap:8px;padding:12px;background:#101d35}
.convform textarea{flex:1;min-width:0;resize:none;border-radius:12px}
.profilemodal{position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:18px}
.profilecard{width:100%;max-width:420px;background:#14213b;border:1px solid #ffffff22;border-radius:20px;padding:20px}
.danger{background:#3a1d28;border:1px solid #6b2d40;color:#ffb3c1;border-radius:12px;padding:12px;width:100%;margin-top:12px}
</style>
</head>
<body>

<section id="auth">
 <div class="authbox">
  <div class="logo">N</div>
  <h1 class="brand">NEXORA</h1>
  <p class="tag">CONNECT BEYOND LIMITS</p>
  <h2 id="authTitle">مرحباً بعودتك</h2>
  <p class="muted" id="authDesc">سجّل الدخول وتواصل مع العالم.</p>
  <form id="authForm">
   <label for="email">البريد الإلكتروني</label>
   <input id="email" type="email" required placeholder="example@email.com" autocomplete="email">
   <label for="password">كلمة المرور</label>
   <input id="password" type="password" required minlength="6" placeholder="••••••••" autocomplete="current-password">
   <div id="nameArea" class="hidden">
    <label for="displayName">الاسم الظاهر</label>
    <input id="displayName" placeholder="اسمك" autocomplete="name">
   </div>
   <button class="primary" id="submitBtn" type="submit">تسجيل الدخول</button>
  </form>
  <p class="switch"><span id="toggle" role="button" tabindex="0">إنشاء حساب جديد</span></p>
  <div id="message" aria-live="polite"></div>
 </div>
</section>

<main id="app" class="hidden">
 <header class="top">
  <div class="topline">
   <div>
    <div class="brandmini">NEX<b>ORA</b></div>
    <div class="subtitle">عالمك، محادثاتك، اتصالك</div>
   </div>
   <button class="profilebtn" id="profileBtn">◉ حسابي</button>
  </div>
  <div class="search">
   <input id="filter" placeholder="ابحث في محادثاتك...">
  </div>
 </header>

 <section class="stories">
  <div class="story"><div class="circle"><span>＋</span></div>حالتي</div>
  <div class="story"><div class="circle"><span>✦</span></div>الحالات</div>
  <div class="story"><div class="circle"><span>◉</span></div>اكتشف</div>
 </section>

 <div class="sectionhead">
  <h2>المحادثات</h2>
  <button class="newbtn" id="newChat">＋ محادثة جديدة</button>
 </div>
 <div id="status">جارٍ تحميل المحادثات...</div>
 <section id="chatList"></section>

 <nav class="bottom">
  <button class="navbtn active"><strong>▤</strong>المحادثات</button>
  <button class="navbtn" id="storiesBtn"><strong>◉</strong>الحالات</button>
  <button class="navbtn" id="callsBtn"><strong>♧</strong>المكالمات</button>
  <button class="navbtn" id="settingsBtn"><strong>⚙</strong>الإعدادات</button>
 </nav>
</main>

<section id="conversation" class="hidden">
 <header class="convhead">
  <button class="newbtn" id="convBack">رجوع</button>
  <div class="avatar" id="convAvatar">N</div>
  <div style="flex:1;min-width:0">
   <b id="convTitle">المحادثة</b>
   <div class="muted" id="convState">تحميل...</div>
  </div>
 </header>
 <div id="messages" class="convbody"><div class="empty">جارٍ تحميل الرسائل...</div></div>
 <form id="sendForm" class="convform">
  <textarea id="messageText" rows="1" maxlength="5000" placeholder="اكتب رسالتك..."></textarea>
  <button class="newbtn" id="sendBtn" type="submit">إرسال</button>
 </form>
</section>

<section id="profileModal" class="profilemodal hidden">
 <div class="profilecard">
  <div class="modalhead">
   <h2>ملفي الشخصي</h2>
   <button class="close" id="profileClose">×</button>
  </div>
  <label for="profileDisplay">الاسم الظاهر</label>
  <input id="profileDisplay">
  <label for="profileUsername">اسم المستخدم</label>
  <input id="profileUsername">
  <button class="primary" id="profileSave">حفظ التغييرات</button>
  <button class="danger" id="logoutBtn">تسجيل الخروج</button>
  <div id="profileMessage" class="muted" style="margin-top:12px"></div>
 </div>
</section>

<div id="newPanel" class="hidden">
 <div class="modal">
  <div class="modalhead">
   <h2>محادثة جديدة</h2>
   <button class="close" id="closePanel">×</button>
  </div>
  <p class="muted">ابحث عن مستخدم بالاسم أو اسم المستخدم.</p>
  <input id="userSearch" placeholder="اكتب اسم المستخدم...">
  <div id="userResults" style="margin-top:12px"></div>
 </div>
</div>

<script>
(function(){
"use strict";

const SUPABASE_URL="https://bhxqovclabgfxifaxwrf.supabase.co";
const SUPABASE_KEY="sb_publishable_KELy2zTCIz73Os1eQDa8eQ_QWcCFNRJ";

const $=id=>document.getElementById(id);

let db=null;
let signup=false;
let currentUser=null;
let allChats=[];
let searchTimer=null;
let activeConversation=null;
let messageChannel=null;
let knownMessages=new Set();

function showMessage(text,success=false){
 const el=$("message");
 el.textContent=text;
 el.style.color=success?"#70e5b0":"#ffaaaa";
}

function setMode(){
 signup=!signup;
 $("authTitle").textContent=signup?"إنشاء حساب جديد":"مرحباً بعودتك";
 $("authDesc").textContent=signup?"أنشئ حسابك في NEXORA.":"سجّل الدخول وتواصل مع العالم.";
 $("submitBtn").textContent=signup?"إنشاء الحساب":"تسجيل الدخول";
 $("toggle").textContent=signup?"لديك حساب؟ تسجيل الدخول":"إنشاء حساب جديد";
 $("nameArea").classList.toggle("hidden",!signup);
 $("password").setAttribute("autocomplete",signup?"new-password":"current-password");
 showMessage("");
}

$("toggle").addEventListener("click",setMode);
$("toggle").addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){e.preventDefault();setMode();}
});

async function enterApp(user){
 currentUser=user;
 $("auth").classList.add("hidden");
 $("conversation").classList.add("hidden");
 $("app").classList.remove("hidden");
 await loadChats();
}

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("submitBtn");
 button.disabled=true;
 showMessage("جارٍ الاتصال...");

 try{
  if(!db)throw new Error("تعذر الاتصال بخدمة Supabase. تحقق من الإنترنت.");

  const email=$("email").value.trim();
  const password=$("password").value;
  let result;

  if(signup){
   const displayName=$("displayName").value.trim();
   if(!displayName)throw new Error("أدخل الاسم الظاهر أولاً.");

   result=await db.auth.signUp({
    email,
    password,
    options:{data:{display_name:displayName}}
   });
   if(result.error)throw result.error;

   if(!result.data.session){
    showMessage("تم إنشاء الحساب. افتح بريدك الإلكتروني وأكّد الحساب، ثم سجّل الدخول.",true);
    return;
   }
  }else{
   result=await db.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
  }

  if(result.data.session){
   showMessage("تم تسجيل الدخول بنجاح.",true);
   await enterApp(result.data.session.user);
  }
 }catch(err){
  showMessage(err.message||"حدث خطأ غير معروف.");
 }finally{
  button.disabled=false;
 }
});

async function loadChats(){
 $("status").textContent="جارٍ تحميل المحادثات...";

 const {data,error}=await db.from("conversation_members")
  .select("conversation_id,conversations(id,is_group,title,created_at)")
  .eq("user_id",currentUser.id);

 if(error){
  $("status").textContent="تعذر تحميل المحادثات: "+error.message;
  return;
 }

 const convs=(data||[]).map(r=>r.conversations).filter(Boolean);
 const names={};

 if(convs.length){
  const ids=convs.map(c=>c.id);
  const {data:others}=await db.from("conversation_members")
   .select("conversation_id,user_id")
   .in("conversation_id",ids)
   .neq("user_id",currentUser.id);

  const otherIds=[...new Set((others||[]).map(m=>m.user_id))];
  let profiles=[];
  if(otherIds.length){
   const {data:p}=await db.from("profiles").select("id,display_name,username").in("id",otherIds);
   profiles=p||[];
  }
  const byId={};
  profiles.forEach(p=>byId[p.id]=p);
  (others||[]).forEach(m=>{
   if(!names[m.conversation_id]){
    const p=byId[m.user_id];
    names[m.conversation_id]=p?(p.display_name||p.username):null;
   }
  });
 }

 allChats=convs.map(c=>({
  ...c,
  displayTitle:c.is_group?(c.title||"مجموعة"):(names[c.id]||"محادثة خاصة")
 }));

 applyFilter();
}

function applyFilter(){
 const q=$("filter").value.trim().toLowerCase();
 renderChats(allChats.filter(c=>c.displayTitle.toLowerCase().includes(q)));
}

function renderChats(chats){
 const list=$("chatList");
 list.innerHTML="";
 $("status").textContent=allChats.length?allChats.length+" محادثة":"لا توجد محادثات حتى الآن";

 if(!chats.length){
  list.innerHTML='<div class="empty">ليس لديك محادثات بعد.<br>ابدأ محادثة جديدة مع أحد مستخدمي NEXORA.</div>';
  return;
 }

 chats.forEach(chat=>{
  const row=document.createElement("div");
  row.className="chatrow";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=chat.is_group?"👥":(chat.displayTitle.trim().charAt(0)||"N");

  const info=document.createElement("div");
  info.className="chatinfo";

  const name=document.createElement("div");
  name.className="chatname";
  name.textContent=chat.displayTitle;

  const preview=document.createElement("div");
  preview.className="preview";
  preview.textContent="افتح المحادثة";

  info.append(name,preview);
  row.append(avatar,info);
  row.addEventListener("click",()=>openConversation(chat.id,chat.displayTitle));
  list.append(row);
 });
}

$("filter").addEventListener("input",applyFilter);

$("newChat").addEventListener("click",()=>{
 $("newPanel").classList.remove("hidden");
 $("userSearch").value="";
 $("userResults").textContent="";
});

$("closePanel").addEventListener("click",()=>$("newPanel").classList.add("hidden"));

$("userSearch").addEventListener("input",()=>{
 clearTimeout(searchTimer);
 searchTimer=setTimeout(searchUsers,400);
});

async function searchUsers(){
 const query=$("userSearch").value.trim();
 const results=$("userResults");

 if(query.length<2){
  results.textContent="اكتب حرفين على الأقل للبحث.";
  return;
 }

 results.textContent="جارٍ البحث...";
 const safe=query.replace(/[*,()"]/g,"");

 const {data,error}=await db.from("profiles")
  .select("id,username,display_name")
  .neq("id",currentUser.id)
  .or(`username.ilike.*${safe}*,display_name.ilike.*${safe}*`)
  .limit(15);

 if(error){
  results.textContent="تعذر البحث: "+error.message;
  return;
 }

 results.innerHTML="";

 if(!data||!data.length){
  results.textContent="لم يتم العثور على مستخدمين.";
  return;
 }

 data.forEach(user=>{
  const row=document.createElement("div");
  row.className="userresult";

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=(user.display_name||user.username||"N").charAt(0);

  const info=document.createElement("div");
  const name=document.createElement("div");
  name.className="chatname";
  name.textContent=user.display_name||"مستخدم NEXORA";

  const handle=document.createElement("div");
  handle.className="preview";
  handle.textContent=user.username?"@"+user.username:"";

  info.append(name,handle);
  row.append(avatar,info);
  row.addEventListener("click",()=>startChat(user));
  results.append(row);
 });
}

async function startChat(user){
 $("userResults").textContent="جارٍ إنشاء المحادثة...";

 const {data:convId,error}=await db.rpc("create_direct_conversation",{p_other_user_id:user.id});

 if(error){
  $("userResults").textContent="تعذر إنشاء المحادثة: "+error.message;
  return;
 }

 $("newPanel").classList.add("hidden");
 await loadChats();
 openConversation(convId,user.display_name||user.username||"مستخدم NEXORA");
}

function openProfile(){
 db.from("profiles").select("id,username,display_name").eq("id",currentUser.id).single()
  .then(({data,error})=>{
   if(error){alert(error.message);return;}
   $("profileDisplay").value=data.display_name||"";
   $("profileUsername").value=data.username||"";
   $("profileMessage").textContent="";
   $("profileModal").classList.remove("hidden");
  });
}

$("profileBtn").addEventListener("click",openProfile);
$("profileClose").addEventListener("click",()=>$("profileModal").classList.add("hidden"));

$("profileSave").addEventListener("click",async()=>{
 const display_name=$("profileDisplay").value.trim();
 const username=$("profileUsername").value.trim();
 if(!display_name||!username){
  $("profileMessage").textContent="أدخل الاسم واسم المستخدم.";
  return;
 }
 const {error}=await db.from("profiles").update({display_name,username}).eq("id",currentUser.id);
 $("profileMessage").textContent=error?error.message:"تم حفظ الملف الشخصي.";
});

$("logoutBtn").addEventListener("click",async()=>{
 if(!confirm("هل تريد تسجيل الخروج؟"))return;
 const {error}=await db.auth.signOut();
 if(error){alert(error.message);return;}
 location.reload();
});

$("storiesBtn").addEventListener("click",()=>alert("قسم الحالات قيد التطوير."));
$("callsBtn").addEventListener("click",()=>alert("المكالمات تحتاج إعداد خدمة اتصال مستقلة."));
$("settingsBtn").addEventListener("click",()=>alert("إعدادات الحساب قيد التطوير."));

function renderMessage(m){
 if(knownMessages.has(m.id))return;
 knownMessages.add(m.id);

 const box=$("messages");
 if(box.querySelector(".empty"))box.innerHTML="";

 const el=document.createElement("div");
 el.className="msg"+(m.sender_id===currentUser.id?" mine":"");
 el.textContent=m.content||"";

 const stamp=document.createElement("small");
 stamp.textContent=new Date(m.created_at).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
 el.appendChild(stamp);

 box.appendChild(el);
 box.scrollTop=box.scrollHeight;
}

function showEmpty(text){
 const box=$("messages");
 box.innerHTML="";
 const div=document.createElement("div");
 div.className="empty";
 div.textContent=text;
 box.appendChild(div);
}

async function openConversation(id,title){
 activeConversation=id;
 knownMessages.clear();
 $("convTitle").textContent=title;
 $("convAvatar").textContent=(title.trim().charAt(0)||"N");
 showEmpty("جارٍ تحميل الرسائل...");
 $("app").classList.add("hidden");
 $("conversation").classList.remove("hidden");

 const {data,error}=await db.from("messages")
  .select("id,sender_id,content,created_at")
  .eq("conversation_id",id)
  .is("deleted_at",null)
  .order("created_at",{ascending:true})
  .limit(300);

 if(error){
  showEmpty("تعذر تحميل الرسائل: "+error.message);
  return;
 }

 $("messages").innerHTML="";
 (data||[]).forEach(renderMessage);
 if(!data||!data.length)showEmpty("لا توجد رسائل بعد. اكتب أول رسالة.");

 if(messageChannel){
  await db.removeChannel(messageChannel);
  messageChannel=null;
 }

 messageChannel=db.channel("nexora-"+id)
  .on("postgres_changes",
   {event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+id},
   payload=>renderMessage(payload.new))
  .subscribe(status=>{
   $("convState").textContent=status==="SUBSCRIBED"?"متصل — استقبال فوري":"الاتصال: "+status;
  });
}

$("convBack").addEventListener("click",async()=>{
 if(messageChannel){
  await db.removeChannel(messageChannel);
  messageChannel=null;
 }
 activeConversation=null;
 $("conversation").classList.add("hidden");
 $("app").classList.remove("hidden");
});

$("sendForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const input=$("messageText");
 const content=input.value.trim();
 if(!content||!activeConversation)return;

 const btn=$("sendBtn");
 btn.disabled=true;

 const {data,error}=await db.from("messages")
  .insert({conversation_id:activeConversation,sender_id:currentUser.id,content,message_type:"text"})
  .select("id,sender_id,content,created_at")
  .single();

 btn.disabled=false;
 if(error){
  alert("تعذر الإرسال: "+error.message);
  return;
 }

 input.value="";
 renderMessage(data);
});

$("messageText").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  $("sendForm").requestSubmit();
 }
});

async function initialize(){
 if(!window.supabase){
  showMessage("تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت.");
  return;
 }

 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

 db.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT"){
   currentUser=null;
   $("app").classList.add("hidden");
   $("conversation").classList.add("hidden");
   $("auth").classList.remove("hidden");
  }
 });

 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(data.session)await enterApp(data.session.user);
 }catch(err){
  showMessage("خطأ في تهيئة التطبيق: "+err.message);
 }
}

initialize();

})();
</script>
</body>
</html>
